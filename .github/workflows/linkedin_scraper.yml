name: LinkedIn Profile Scraper

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công
  schedule:
    - cron: '*/30 * * * *' # Tùy chọn tự động chạy định kỳ

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          LINKEDIN_COOKIES_B64: ${{ secrets.LINKEDIN_COOKIES_B64 }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          SHEET_ID_OR_URL: ${{ secrets.SHEET_ID_OR_URL }}
          INPUT_TAB_NAME: ${{ secrets.INPUT_TAB_NAME }}
        run: python scraper.py

      - name: Upload Debug Screenshots (If any failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
